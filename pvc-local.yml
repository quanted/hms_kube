apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hms-app-data-pvolume-claim
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  volumeName: app-data-pvolume
  resources:
    requests:
      storage: 5Gi
