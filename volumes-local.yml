##################################
# PVs
##################################
apiVersion: v1
kind: PersistentVolume
metadata:
  name: hms-app-data-pvolume
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: manual
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: default
    name: hms-app-data-pvolume-claim
  hostPath:
    path: ${HMS_PV_LOCAL_PATH}
---
