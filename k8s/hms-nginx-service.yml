apiVersion: v1
kind: Service
metadata:
  name: hms-nginx
  namespace: default
spec:
  selector:
    app: hms-nginx
  # type: ClusterIP
  type: NodePort
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
      nodePort: 32001
    - protocol: TCP
      port: 7777
      targetPort: 7777
      name: flask
      nodePort: 32002
