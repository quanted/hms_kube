apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hms-nginx
  name: hms-nginx
  namespace: default

spec:
  replicas: 1
  selector:
    matchLabels:
      app: hms-nginx
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: hms-nginx
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: hms-config
        image: ghcr.io/quanted/hms-nginx:dev-gl
        imagePullPolicy: Always
        name: nginx
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 15
          periodSeconds: 30
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "500Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
#         - containerPort: 443
        volumeMounts:
        - mountPath: /src/collected_static
          name: collected-static

      volumes:
      - name: collected-static
        persistentVolumeClaim:
          claimName: collected-static-pvolume-claim
